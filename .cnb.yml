# 云原生构建流水线配置
#
# 用途：为 NPC（@CodeBuddy）显式指定底层大模型，锁定为 deepseek-v4.1-flash。
# 说明：NPC 事件（issue.comment@npc / pull_request.comment@npc）默认使用平台默认模型；
#       此处通过 npc:go 的 options.model 覆盖，使后续所有 NPC 交互均走该模型。
#
# 注意：指定自定义 model 后，平台默认模型自带的图片能力不会被继承；
#       如需 NPC 读图，需同时声明 supportImage: true（且底层模型需支持图片输入）。

$:
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash
