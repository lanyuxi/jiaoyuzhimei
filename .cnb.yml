# 云原生构建流水线配置
#
# 本文件包含两部分：
#   1) main 分支 push 时，把代码同步到 GitHub（lanyuxi/jiaoyuzhimei）
#   2) 为 NPC（@CodeBuddy）显式指定底层大模型，锁定为 deepseek-v4.1-flash

main:
  push:
    - name: sync-to-github
      imports:
        # 密钥仓库，提供 GIT_USERNAME / GIT_TOKEN（GitHub Fine-grained PAT）
        - https://cnb.cool/xixi2060/gh-secret/-/blob/main/github.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/lanyuxi/jiaoyuzhimei.git
            auth_type: https
            username: $GIT_USERNAME
            password: $GIT_TOKEN
            branch: main
            force: true
            sync_mode: push
            git_user: CodeBuddy
            git_email: codebuddy@cnb.cool

$:
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash
